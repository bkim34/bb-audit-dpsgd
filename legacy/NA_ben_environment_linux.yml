name: bb_audit_dpsgd
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip

  # core scientific stack
  - numpy=1.26
  - scipy=1.15
  - pandas=2.3
  - scikit-learn=1.2
  - matplotlib=3.10
  - ipykernel
  - ipython
  - jinja2
  - requests
  - tqdm
  - joblib

  # GPU PyTorch (CUDA 12.1 build matches your driver 535)
  - pytorch::pytorch=2.5
  - pytorch::torchvision=0.20
  - pytorch::torchaudio=2.5
  - pytorch-cuda=12.1

  # niceties
